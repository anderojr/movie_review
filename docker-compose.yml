services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      target: build
    command: >
      bash -c "bundle install &&
               rm -f tmp/pids/server.pid &&
               ./bin/rails db:prepare &&
               ./bin/rails db:seed &&
               ./bin/rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      BUNDLE_WITHOUT: ""
      DATABASE_URL: postgresql://postgres:password@db/movie_review_development
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  css:
    build:
      context: .
      target: build
    command: yarn build:css --watch
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
    environment:
      RAILS_ENV: development

volumes:
  postgres_data:
  bundle_cache:
  node_modules:
